suite: createSecrets rendering
templates:
  - secrets.yaml
tests:
  - it: renders one Secret per createSecrets entry
    set:
      createSecrets:
        one:
          stringData:
            first: "1"
        two:
          stringData:
            second: "2"
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: metadata.name
          value: RELEASE-NAME-stateless-svc-one
        documentIndex: 0
      - equal:
          path: stringData
          value:
            first: "1"
        documentIndex: 0
      - equal:
          path: metadata.name
          value: RELEASE-NAME-stateless-svc-two
        documentIndex: 1
      - equal:
          path: stringData
          value:
            second: "2"
        documentIndex: 1

  - it: renders no Secret when createSecrets is empty
    asserts:
      - hasDocuments:
          count: 0
